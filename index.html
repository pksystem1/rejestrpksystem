<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PKSYSTEM – System produkcyjny</title>
<meta name="theme-color" content="#1D6672" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#173740" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PKSYSTEM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2; --panel:#FFFFFF; --ink:#13313A; --muted:#58707A; --line:#D6E1E0; --soft:#E4EEEC;
  --head:#1D6672; --head-ink:#FFFFFF;
  --brand:#1D6672; --brand-deep:#134A54; --brand-btn:#1D6672; --brandtint:#DCEEF0; --focus:#2B8CA0;
  --go:#1B8A67; --go-ink:#FFFFFF; --stop:#C4483D; --stop-ink:#FFFFFF; --pause:#E8B22A; --pause-ink:#2B2105;
  --warn-bg:#FFF0CF; --warn-ink:#6B4700;
  --op-zgrzewanie:#D9743B; --op-szypulkowanie:#3E8FB0; --op-pakowanie:#7A62B8; --op-sprzatanie:#5E9E6E; --op-inna:#8A9BA1;
  --av-l:88%; --av-ink:26%;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C20; --panel:#172A30; --ink:#E4EEEF; --muted:#93AAAF; --line:#274149; --soft:#1D343B;
    --head:#173740; --head-ink:#E9F3F4;
    --brand:#7FCAD5; --brand-deep:#BFE7EC; --brand-btn:#2C7D8A; --brandtint:#21444C; --focus:#8FD6E0;
    --go:#2FA67F; --go-ink:#06201A; --stop:#E2635A; --stop-ink:#2A0905; --pause:#E8B22A; --pause-ink:#2B2105;
    --warn-bg:#4A3912; --warn-ink:#FFDFA0;
    --op-zgrzewanie:#E88F58; --op-szypulkowanie:#5FB0D1; --op-pakowanie:#9C86D6; --op-sprzatanie:#7FC08F; --op-inna:#9FB0B5;
    --av-l:26%; --av-ink:86%;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C20; --panel:#172A30; --ink:#E4EEEF; --muted:#93AAAF; --line:#274149; --soft:#1D343B;
  --head:#173740; --head-ink:#E9F3F4;
  --brand:#7FCAD5; --brand-deep:#BFE7EC; --brand-btn:#2C7D8A; --brandtint:#21444C; --focus:#8FD6E0;
  --go:#2FA67F; --go-ink:#06201A; --stop:#E2635A; --stop-ink:#2A0905; --pause:#E8B22A; --pause-ink:#2B2105;
  --warn-bg:#4A3912; --warn-ink:#FFDFA0;
  --op-zgrzewanie:#E88F58; --op-szypulkowanie:#5FB0D1; --op-pakowanie:#9C86D6; --op-sprzatanie:#7FC08F; --op-inna:#9FB0B5;
  --av-l:26%; --av-ink:86%;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- nagłówek ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));
  background-color:var(--head);color:var(--head-ink);
  background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,.17) 1.6px,transparent 2px);background-size:17px 17px}
.brand{display:flex;align-items:center;gap:12px}
.brand .txt{display:flex;flex-direction:column;line-height:1.1}
.wm{font-weight:800;font-size:22px;letter-spacing:.02em}
.sub{font-weight:600;font-size:11.5px;letter-spacing:.14em;opacity:.85;margin-top:3px}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:inherit;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.24)}

/* ---------- układ ---------- */
main{max-width:1100px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.view{display:none}.view.on{display:block}
.narrow{max-width:560px;margin:0 auto}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:6px 0 16px;letter-spacing:-.01em}
h2{font-size:23px;line-height:1.2;font-weight:800;margin:0 0 10px}
h3{font-size:18px;font-weight:800;margin:0 0 4px}
p{margin:0 0 10px}
.lead{color:var(--muted);margin:-6px 0 18px}
.muted{color:var(--muted)}
.head-row{display:flex;align-items:center;gap:12px}
.count{background:var(--brandtint);color:var(--brand-deep);font-weight:800;border-radius:99px;padding:2px 12px;font-size:16px;margin-top:-6px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel+.panel{margin-top:14px}

/* ---------- kroki ---------- */
.steps{display:flex;gap:8px;margin:0 0 18px;padding:0}
.steps li{flex:1;list-style:none;font-size:13.5px;font-weight:700;color:var(--muted);border-top:4px solid var(--line);padding-top:7px}
.steps li.done{border-color:var(--brand);color:var(--ink)}
.steps li.cur{border-color:var(--brand);color:var(--brand)}

.tiles{display:grid;gap:12px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:20px 16px;text-align:left;min-height:100px;display:flex;flex-direction:column;gap:6px;justify-content:center;transition:border-color .15s,transform .1s}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.98)}
.tile .t1{font-size:23px;font-weight:800}
.tile .t2{color:var(--muted);font-weight:600}
.tile.person{flex-direction:row;align-items:center;gap:10px;min-height:76px;padding:10px 12px}
.tile.person .av{width:36px;height:36px;font-size:16px}
.tile.person .t1{font-size:18px;min-width:0;overflow-wrap:anywhere}
.now{align-self:flex-start;font-size:12.5px;font-weight:800;background:var(--brandtint);color:var(--brand-deep);padding:2px 10px;border-radius:99px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;background:hsl(var(--h) 38% var(--av-l));color:hsl(var(--h) 45% var(--av-ink))}
.who{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--muted)}
.who b{color:var(--ink)}
.who .av{width:38px;height:38px;font-size:16px}
.link{background:none;border:0;color:var(--brand);font-weight:700;text-decoration:underline;padding:6px 4px;font-size:inherit}
.link.dang{color:var(--stop)}
.back{margin:0 0 6px -4px}

.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 14px;font-weight:700;font-size:15px}
.chip .link{font-size:14px;padding:2px 8px}
button.chip{padding:8px 16px;font-weight:700}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* ---------- pola ---------- */
label,.lbl{display:block;font-weight:700;margin:16px 0 6px}
.in{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-size:18px;min-height:54px}
.in:focus{border-color:var(--brand);background:var(--panel)}
textarea.in{resize:vertical;min-height:80px}
.hint{font-size:14.5px;color:var(--muted);min-height:20px;margin-top:8px}
.hint.warn{color:var(--stop);font-weight:600}

.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.op{display:flex;align-items:center;gap:10px;min-height:62px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-weight:700;font-size:17px;text-align:left}
.op i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.op[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel));box-shadow:inset 0 0 0 1px var(--c)}

/* ---------- przyciski ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:15px 22px;font-weight:800;font-size:18px;min-height:56px;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.stop{background:var(--stop);color:var(--stop-ink)}
.btn.pause{background:var(--pause);color:var(--pause-ink)}
.btn.brand{background:var(--brand-btn);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.wide{display:flex;width:100%;font-size:26px;padding:20px;margin-top:20px}
.btn.wide2{display:flex;width:100%;margin-top:12px}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}

/* ---------- mini lista aktywnych ---------- */
.mini{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px}
.mini-h{font-weight:800;margin-bottom:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .mt{flex:1;min-width:0}
.mrow small{display:block;color:var(--muted)}
.mc{font-weight:800;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin-right:8px}
.mrow .dot{margin-right:0}

/* ---------- ekran startu ---------- */
.done{text-align:center}
.ring{position:relative;width:132px;height:132px;margin:8px auto 14px}
.ring svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:9}
.ring .r0{stroke:var(--line)}
.ring .r1{stroke:var(--go);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rin{position:absolute;inset:0;display:grid;place-content:center;font-weight:800}
.rin b{font-size:40px;line-height:1}
.rin small{color:var(--muted);font-size:14px}
.dsum{text-align:left;margin:6px 0 4px}
.dsum p{margin:4px 0}
.opchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;font-weight:800;font-size:14.5px;background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--ink);border:1px solid var(--c)}
.opchip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ---------- aktywne ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:9px solid var(--c);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.tcard.paused{border-left-color:var(--pause)}
.trow{display:flex;align-items:center;gap:12px}
.trow .who2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.trow .who2 small{color:var(--muted)}
.job{font-weight:700}
.clock{font-size:clamp(46px,12vw,58px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.05}
.tcard.paused .clock{color:var(--muted)}
.state{font-size:15px;color:var(--muted);font-weight:600}
.state.p{color:var(--warn-ink);background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.flag{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:7px 11px;font-size:14.5px;font-weight:700;margin:6px 0}
.tcard .actions{display:flex;gap:10px;margin-top:6px}
.tcard .actions .btn{flex:1;padding:13px;font-size:17px}
.demo-chip{font-size:12px;font-weight:800;background:var(--soft);border-radius:8px;padding:1px 7px;color:var(--muted)}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

/* ---------- kierownik ---------- */
.gate{text-align:center}
.gate .in{text-align:center;font-size:26px;letter-spacing:.4em;max-width:240px;margin:0 auto}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:16px;overflow-x:auto;flex:1}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 16px;font-weight:700;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--brand)}
.mgr-top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.lockbtn{background:var(--soft);color:var(--ink);flex:none}
.lockbtn:hover{background:var(--line)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.acts{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:800;margin-right:4px}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--brandtint);color:var(--brand-deep)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:32px;font-weight:800;line-height:1.05}
.kpi span{color:var(--muted);font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cgrid{grid-template-columns:1fr}}
.cgrid .panel+.panel{margin-top:0}
.cbox{position:relative;height:280px}
.sub2{color:var(--muted);font-size:14px;margin:0 0 10px}
.row2{display:flex;gap:10px;margin-top:16px}
.row2 .btn{flex:1}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:820px){.setgrid{grid-template-columns:1fr}}
.setgrid .panel+.panel{margin-top:0}
.fileline{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:8px 0}
#qr img,#qr canvas{display:block;max-width:100%;height:auto}
.url{word-break:break-all;font-size:13px;color:var(--muted)}
.lock{width:64px;height:64px;border-radius:50%;background:var(--brandtint);color:var(--brand-deep);display:grid;place-items:center;margin:0 auto 10px}

/* ---------- dolna nawigacja ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:10px 6px 9px;font-weight:700;font-size:13.5px}
.bar button[aria-current="page"]{color:var(--brand)}
.bar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:4px;border-radius:0 0 4px 4px;background:var(--brand)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:10px;background:var(--stop);color:var(--stop-ink);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* ---------- okno dialogowe ---------- */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:24px;width:min(540px,calc(100% - 24px));max-height:92%;overflow:auto}
dialog::backdrop{background:rgba(8,22,27,.58)}
dialog[open]{animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.dlg-body{padding:22px}
.dlg-body .sum{color:var(--muted);margin:-4px 0 8px}
.big-dur{font-size:38px;font-weight:800;margin:4px 0 8px}
.rlist{display:grid;gap:10px;margin:12px 0}
.rbtn{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:16px;font-weight:800;font-size:18px;text-align:left}
.rbtn:hover{border-color:var(--pause)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700}
.chk input{width:22px;height:22px}
@media (max-width:640px){
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}

@media (max-width:480px){
  .seg{gap:2px;padding:4px}
  .seg button{padding:10px 5px;font-size:14px}
  .tile .t1{font-size:20px}
  .tiles.two{gap:10px}
}
/* ---------- wersja pilotażowa: nakładka orientacji, instalacja, wykresy ---------- */
#rotate{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;background:var(--head);color:var(--head-ink);padding:24px}
#rotate h1{font-size:26px;margin:10px 0 0}
#rotate p{margin:0;opacity:.85}
.install{background:var(--brandtint);color:var(--ink);border-radius:16px;padding:14px 16px;margin-top:18px}
.install b{display:block;margin-bottom:4px}
.install p{margin:0 0 8px;font-size:15px}
.install .fileline{margin:4px 0 0}
.hb-r{margin:11px 0}
.hb-l{font-size:14.5px;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere}
.hb-t{display:flex;align-items:center;gap:8px;min-height:22px}
.hb-b{display:block;height:20px;border-radius:6px;flex:none}
.hb-s{display:flex;height:20px;border-radius:6px;overflow:hidden;flex:none;background:var(--soft)}
.hb-s i{display:block;min-width:2px}
.hb-v{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;font-weight:700;margin-bottom:6px}
.lg i,.rg-h i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.rg-h{font-weight:800;margin-top:10px}
.dc{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding-bottom:4px}
.dc-c{flex:1 0 36px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dc-bw{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.dc-bw i{display:block;width:70%;background:var(--brand);border-radius:5px 5px 0 0}
.dc-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dc-l{font-size:12px;color:var(--muted)}
#qr svg{display:block;max-width:100%;height:auto}
.ver{color:var(--muted);font-size:14px}
.upd{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--panel);border-radius:16px;padding:12px 14px;font-weight:700}
.panel p.muted{font-size:14.5px}
@media (prefers-reduced-motion:reduce){
  dialog[open]{animation:none}
  .ring .r1{transition:none}
  *{scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="top">

		for (var i = 0; i < length; i++) {

		var bufIndex = Math.floor(this.length / 8);

			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}

					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

      +'<div id="opTextWrap" '+(op&&op.text?'':'hidden')+'><label for="opText">Opis operacji (maks. 2 słowa)</label><input class="in" id="opText" maxlength="30" autocomplete="off" value="'+esc(flow.opText)+'"></div>'
      +'<div class="hint" id="formHint" aria-live="polite"></div>'
      +'<button class="btn go wide" id="startBtn" disabled>Start</button></div>';
    flow._built=true;
  }
  h+='</div>';
  homeEl.innerHTML=h;
  if(flow.step===3){refreshLists();refreshForm()}
}

function knownPairs(){
  const out=[];
  String(cfg.projects||"").split(/\r?\n/).forEach(l=>{
    const p=l.split(/[;\t|]/).map(x=>x.trim());
    if(p.length>=2&&p[0]&&p[1])out.push({client:p[0],project:p[1]});
  });
  entries.concat(active).forEach(e=>{if(e.client&&e.project)out.push({client:e.client,project:e.project})});
  return out;
}
function refreshLists(){
  const all=knownPairs(),c=flow.client.trim().toLowerCase();
  const clients=Array.from(new Set(all.map(p=>p.client))).slice(0,60);
  let projs=Array.from(new Set(all.filter(p=>!c||p.client.toLowerCase()===c).map(p=>p.project)));
  if(!projs.length)projs=Array.from(new Set(all.map(p=>p.project)));
  const a=$("#dlClients"),b=$("#dlProjects");
  if(a)a.innerHTML=clients.map(x=>'<option value="'+esc(x)+'">').join("");
  if(b)b.innerHTML=projs.slice(0,60).map(x=>'<option value="'+esc(x)+'">').join("");
}
function formState(){
  const op=OPS.find(o=>o.id===flow.op),w=words(flow.opText);
  let ok=!!(clean(flow.client)&&clean(flow.project)&&op),hint="";
  if(op&&op.text){
    if(!w.length){ok=false;hint="Wpisz krótki opis operacji (1–2 słowa)."}
    else if(w.length>2){ok=false;hint="Opis: maksymalnie dwa słowa."}
  }
  return {ok,hint,op};
}
function refreshForm(){
  const s=formState(),b=$("#startBtn"),h=$("#formHint");
  if(b)b.disabled=!s.ok;
  if(h){h.textContent=s.hint;h.className="hint"+(s.hint?" warn":"")}
}

function startTimer(){
  const s=formState();if(!s.ok)return;
  const sh=shiftById(flow.shift),now=Date.now();
  const t={id:uid(),worker:flow.worker,shift:sh.id,client:clean(flow.client),project:clean(flow.project),op:flow.op,
    opText:flow.op==="inna"?clean(flow.opText):"",start:now,shiftEnd:shiftBounds(sh,now).to,pauses:[],open:null};
  active.push(t);saveActive();
  const label=opLabel(opById(t.op),t.opText);
  resetFlow();renderHome();updateBadge();
  toast("Czas ruszył: "+t.worker+" · "+label);
}
function resetFlow(){flow=freshFlow()}

homeEl.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.shift){
    flow.shift=+d.shift;
    if(meValid()){flow.worker=me;flow.step=3}else flow.step=2;
    renderHome();return;
  }
  if(d.worker){
    flow.worker=d.worker;
    if(cfg.device==="private"){me=d.worker;store.set("pk_me",me)}
    flow.step=3;renderHome();return;
  }
  if(d.back){flow.step=+d.back;renderHome();return}
  if(d.op){
    flow.op=d.op;
    $$(".op",homeEl).forEach(x=>x.setAttribute("aria-pressed",x===b));
    const o=opById(d.op),w=$("#opTextWrap");
    if(w){w.hidden=!o.text;if(o.text)$("#opText").focus()}
    refreshForm();return;
  }
  if(b.id==="startBtn"){startTimer();return}
  if(d.act==="forget"){me="";store.set("pk_me","");renderHome();return}
  if(d.act==="install"&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;renderHome()});return}
  if(d.act==="hintoff"){store.set("pk_hint_off",true);renderHome();return}
  if(d.goto){setTab(d.goto)}
});
homeEl.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="client"){flow.client=e.target.value;refreshLists();refreshForm()}
  else if(id==="project"){
    flow.project=e.target.value;
    if(!flow.client.trim()){
      const m=Array.from(new Set(knownPairs().filter(p=>p.project.toLowerCase()===flow.project.trim().toLowerCase()).map(p=>p.client)));
      if(m.length===1){flow.client=m[0];$("#client").value=m[0]}
    }
    refreshForm();
  }else if(id==="opText"){flow.opText=e.target.value;refreshForm()}
});

const activeEl=$("#v-active");
function card(t){
  const op=opById(t.op),sh=shiftById(t.shift),paused=!!t.open;
  return '<article class="tcard'+(paused?' paused':'')+'" style="--c:var(--op-'+op.id+')" data-card="'+t.id+'">'
    +'<div class="trow">'+avatar(t.worker)+'<div class="who2"><b>'+esc(t.worker)+'</b><small>'+esc(sh.name)+'</small></div><span class="opchip" style="--c:var(--op-'+op.id+')">'+esc(opLabel(op,t.opText))+'</span></div>'
    +'<div class="job">'+esc(t.client)+' · '+esc(t.project)+'</div>'
    +'<div class="clock" data-clock="'+t.id+'">'+fmtClock(workOf(t))+'</div>'
    +(paused?'<div class="state p">Pauza: '+esc(rlabel(t.open))+' · <span data-pausetime="'+t.id+'">'+fmtClock(vnow(t)-t.open.from)+'</span></div>':'<div class="state">W toku od '+fmtHM(t.start)+'</div>')
    +'<div class="flag" data-flag="'+t.id+'" '+(vnow(t)>t.shiftEnd?'':'hidden')+'>Koniec zmiany minął – wpis trafi do weryfikacji kierownika.</div>'

function renderActive(){
  const list=active.slice().sort((a,b)=>a.start-b.start);
  activeEl.innerHTML='<div class="head-row"><h1>Aktywne czasy</h1><span class="count">'+list.length+'</span></div>'
    +'<p class="lead">'+(cfg.device==="shared"?"Wszystkie czasy uruchomione na tym urządzeniu.":"Czasy uruchomione na tym telefonie.")+'</p>'
    +(list.length?'<div class="tgrid">'+list.map(card).join("")+'</div>':'<div class="panel empty"><b>Brak uruchomionych czasów</b>Wybierz zmianę na ekranie Start i uruchom pierwszą operację.<div><button class="btn brand small" style="margin-top:14px" data-goto="home">Przejdź do Start</button></div></div>');
}
activeEl.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.goto){setTab(b.dataset.goto);return}
  const t=active.find(x=>x.id===b.dataset.id);if(!t)return;
  if(b.dataset.act==="pause")openPause(t.id);
  else if(b.dataset.act==="resume"){
    t.pauses.push({reason:t.open.reason,text:t.open.text||"",ms:Math.max(0,vnow(t)-t.open.from)});
    t.open=null;saveActive();renderActive();toast("Praca wznowiona");
  }else if(b.dataset.act==="stop")openStop(t.id);
});

function openPause(id){
  const t=active.find(x=>x.id===id);if(!t)return;
  openDlg('<div class="dlg-body"><h2>Powód pauzy</h2><p class="sum">'+esc(t.worker)+' · '+esc(opLabel(opById(t.op),t.opText))+'</p>'
    +'<div class="rlist">'+REASONS.map(r=>'<button class="rbtn" data-reason="'+r.id+'">'+esc(r.name)+'</button>').join("")+'</div>'
    +'<div id="rtext" hidden><label for="rt" style="margin-top:0">Opis pauzy (krótko)</label><input class="in" id="rt" maxlength="40" autocomplete="off"><div class="hint warn" id="rerr"></div><button class="btn pause wide2" id="rok">Zatwierdź pauzę</button></div>'
    +'<button class="btn ghost wide2" data-close>Anuluj</button></div>',
  e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.reason){
      const r=REASONS.find(x=>x.id===b.dataset.reason);
      if(r.text){$("#rtext").hidden=false;$("#rt").focus();dlg.dataset.r=r.id;return}
      t.open={reason:r.name,text:"",from:vnow(t)};saveActive();dlg.close();renderActive();toast("Pauza: "+r.name);
    }else if(b.id==="rok"){
      const txt=clean($("#rt").value);
      if(!txt){$("#rerr").textContent="Wpisz krótki opis powodu.";return}
      t.open={reason:"Inne",text:txt,from:vnow(t)};saveActive();dlg.close();renderActive();toast("Pauza: Inne – "+txt);
    }
  });
}

function openStop(id){
  const t=active.find(x=>x.id===id);if(!t)return;
  const at=vnow(t),op=opById(t.op),late=at>t.shiftEnd,work=workOf(t,at);
  openDlg('<div class="dlg-body"><h2>Zakończ: '+esc(opLabel(op,t.opText))+'</h2><p class="sum">'+esc(t.worker)+' · '+esc(t.client)+' · '+esc(t.project)+'</p>'
    +'<div class="big-dur">'+fmtDur(work)+'</div>'
    +(late?'<div class="flag">Koniec zmiany minął – wpis zostanie oznaczony do weryfikacji kierownika.</div>':'')
    +(op.qty!=="none"?'<label for="q">Liczba sztuk'+(op.qty==="opt"?' (opcjonalnie)':'')+'</label><input class="in" id="q" type="number" inputmode="numeric" min="0" step="1">':'')
    +'<label for="nt">Uwagi (opcjonalnie)</label><textarea class="in" id="nt" rows="2" maxlength="200"></textarea>'
    +'<div class="hint warn" id="qh"></div>'
    +'<div class="row2"><button class="btn ghost" data-close>Wróć</button><button class="btn go" id="sv">Zapisz wpis</button></div></div>',
  e=>{
    if(!e.target.closest("#sv"))return;
    let qty=null;
    const q=$("#q");
    if(q){
      const raw=q.value.trim();
      if(raw===""){ if(op.qty==="req"){$("#qh").textContent="Wpisz liczbę sztuk (0 lub więcej).";return} }
      else{
        const n=Number(raw);
        if(!Number.isInteger(n)||n<0||n>1000000){$("#qh").textContent="Liczba sztuk musi być liczbą całkowitą, 0 lub więcej.";return}
        qty=n;
      }
    }
    const pauses=t.pauses.slice();
    if(t.open)pauses.push({reason:t.open.reason,text:t.open.text||"",ms:Math.max(0,at-t.open.from)});
    entries.push({id:t.id,device:deviceName(),worker:t.worker,shift:t.shift,client:t.client,project:t.project,op:t.op,opText:t.opText,start:t.start,end:at,pauses,qty,
      note:clean($("#nt").value),review:late,reviewReason:late?"Po końcu zmiany":"",edited:false,savedAt:Date.now()});
    active=active.filter(x=>x.id!==t.id);
    saveEntries();saveActive();dlg.close();renderActive();updateBadge();
    toast("Zapisano: "+opLabel(op,t.opText)+", "+fmtDur(work));
  });
}

  $$("[data-pausetime]").forEach(el=>{const t=active.find(x=>x.id===el.dataset.pausetime);if(t&&t.open)el.textContent=fmtClock(vnow(t)-t.open.from)});
  $$("[data-flag]").forEach(el=>{const t=active.find(x=>x.id===el.dataset.flag);if(t)el.hidden=!(vnow(t)>t.shiftEnd)});

const rangeChips=()=>[[1,"Dziś"],[7,"7 dni"],[30,"30 dni"],[0,"Wszystko"]].map(r=>'<button class="chip" data-range="'+r[0]+'" aria-pressed="'+(range===r[0])+'">'+r[1]+'</button>').join("");

      +'<td><span class="dot" style="--c:var(--op-'+op.id+')"></span>'+esc(opLabel(op,e.opText))+'</td><td>'+fmtHM(e.start)+'–'+fmtHM(e.end)+'</td>'
      +'<td class="n">'+fmtDur(entryWork(e))+'</td><td class="n">'+(pz?fmtDur(pz):'–')+'</td><td class="n">'+(e.qty==null?'–':e.qty)+'</td>'
      +'<td>'+(e.review?'<span class="pill warn" title="'+esc(e.reviewReason)+'">do weryfikacji</span>':'')+(e.edited?'<span class="pill ok">edytowany</span>':'')+'</td>'

function openEditor(id){

  if(id!=="new"&&!e)return;
  const now=Date.now();
  const v=e||{worker:cfg.workers[0],shift:1,client:"",project:"",op:"zgrzewanie",opText:"",start:now-36e5,end:now,qty:null,note:"",pauses:[]};
  const wl=cfg.workers.includes(v.worker)?cfg.workers:[v.worker].concat(cfg.workers);
  openDlg('<div class="dlg-body"><h2>'+(e?"Edytuj wpis":"Nowy wpis ręczny")+'</h2>'
    +'<div class="two"><div><label for="e_w" style="margin-top:4px">Pracownik</label><select class="in" id="e_w">'+wl.map(w=>'<option'+(w===v.worker?' selected':'')+'>'+esc(w)+'</option>').join("")+'</select></div>'
    +'<div><label for="e_s" style="margin-top:4px">Zmiana</label><select class="in" id="e_s">'+SHIFTS.map(s=>'<option value="'+s.id+'"'+(s.id===+v.shift?' selected':'')+'>'+esc(s.name)+'</option>').join("")+'</select></div></div>'
    +'<div class="two"><div><label for="e_c">Klient</label><input class="in" id="e_c" maxlength="40" value="'+esc(v.client)+'"></div><div><label for="e_p">Projekt</label><input class="in" id="e_p" maxlength="40" value="'+esc(v.project)+'"></div></div>'
    +'<label for="e_o">Operacja</label><select class="in" id="e_o">'+OPS.map(o=>'<option value="'+o.id+'"'+(o.id===v.op?' selected':'')+'>'+esc(o.name)+'</option>').join("")+'</select>'
    +'<div id="e_otw" '+(opById(v.op).text?'':'hidden')+'><label for="e_ot">Opis operacji (maks. 2 słowa)</label><input class="in" id="e_ot" maxlength="30" value="'+esc(v.opText)+'"></div>'
    +'<div class="two"><div><label for="e_st">Start</label><input class="in" id="e_st" type="datetime-local" value="'+toInput(v.start)+'"></div><div><label for="e_en">Stop</label><input class="in" id="e_en" type="datetime-local" value="'+toInput(v.end)+'"></div></div>'
    +'<label for="e_q">Sztuki</label><input class="in" id="e_q" type="number" inputmode="numeric" min="0" step="1" value="'+(v.qty==null?'':v.qty)+'">'
    +'<label for="e_n">Uwagi</label><textarea class="in" id="e_n" rows="2" maxlength="200">'+esc(v.note)+'</textarea>'
    +(v.pauses&&v.pauses.length?'<p class="muted" style="margin-top:10px">Pauzy (bez edycji): '+esc(v.pauses.map(p=>rlabel(p)+" "+fmtDur(p.ms)).join("; "))+'</p>':'')
    +(e&&e.review?'<label class="chk"><input type="checkbox" id="e_v" checked> Wpis zweryfikowany ('+esc(e.reviewReason)+')</label>':'')
    +'<div class="hint warn" id="e_err"></div>'
    +'<div class="row2"><button class="btn ghost" data-close>Anuluj</button><button class="btn go" id="e_save">Zapisz</button></div></div>',
  ev=>{
    if(!ev.target.closest("#e_save"))return;
    const g=i=>$("#"+i).value,err=m=>{$("#e_err").textContent=m};
    const op=opById(g("e_o")),st=fromInput(g("e_st")),en=fromInput(g("e_en")),c=clean(g("e_c")),p=clean(g("e_p")),ot=clean(g("e_ot"));
    if(!c||!p)return err("Uzupełnij klienta i numer projektu.");
    if(isNaN(st)||isNaN(en))return err("Podaj poprawny start i stop.");
    if(en<=st)return err("Stop musi być późniejszy niż start.");
    if(op.text){const w=words(ot);if(!w.length||w.length>2)return err("Opis operacji: 1–2 słowa.")}
    let qty=null;const raw=g("e_q").trim();
    if(raw===""){if(op.qty==="req")return err("Wpisz liczbę sztuk.")}
    else{const n=Number(raw);if(!Number.isInteger(n)||n<0)return err("Sztuki: liczba całkowita, 0 lub więcej.");qty=n}

    const chk=$("#e_v");if(e&&chk&&chk.checked){rec.review=false;rec.reviewReason=""}

  },
  ()=>{$("#e_o").addEventListener("change",ev=>{$("#e_otw").hidden=!opById(ev.target.value).text})});
}

const fnum=(x,d)=>Number(x).toLocaleString("pl-PL",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d});
const hrs=ms=>ms/36e5;
function hbars(rows,unit,dec){

const cpanel=(t,s,body)=>'<div class="panel"><h3>'+t+'</h3><p class="sub2">'+s+'</p>'+body+'</div>';

  const work=R.reduce((s,e)=>s+entryWork(e),0),pz=R.reduce((s,e)=>s+entryPause(e),0),qty=R.reduce((s,e)=>s+(e.qty||0),0),rev=R.filter(e=>e.review).length;
  const kp=[[fnum(hrs(work))+" h","Czas pracy"],[qty.toLocaleString("pl-PL"),"Sztuki"],[String(R.length),"Wpisy"],[fnum(hrs(pz))+" h","Pauzy ("+Math.round(pz/Math.max(1,work+pz)*100)+"% czasu)"],[String(rev),"Do weryfikacji"]];
  h+='<div class="kpis">'+kp.map(k=>'<div class="kpi"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>').join("")+'</div>';

  const pm={};R.forEach(e=>{const k=e.client+" · "+e.project;pm[k]=(pm[k]||0)+entryWork(e)});
  const byProj=Object.entries(pm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(p=>({label:p[0],val:hrs(p[1]),color:"var(--brand)"}));
  const ws=Array.from(new Set(R.map(e=>e.worker))).sort();
  const byWorker=ws.map(w=>{
    const segs=OPS.map(o=>({name:o.name,val:hrs(R.filter(e=>e.worker===w&&e.op===o.id).reduce((s,e)=>s+entryWork(e),0)),color:"var(--op-"+o.id+")"}));

  });
  const rate=OPS.filter(o=>o.qty==="req").map(o=>{
    const rows=ws.map(w=>{
      const rr=R.filter(e=>e.worker===w&&e.op===o.id&&e.qty!=null),t=rr.reduce((s,e)=>s+entryWork(e),0);

  const byPause=Object.entries(pr).sort((a,b)=>b[1]-a[1]).map(p=>({label:p[0],val:Math.round(p[1]/6e4),color:"var(--pause)"}));

  const days=Object.keys(dm).sort().map(k=>({label:k.slice(8)+"."+k.slice(5,7),val:hrs(dm[k])}));

const UNITS={s:{ms:1000,dec:0,tag:"s",name:"sekundy",label:"Sekundy",st:0},min:{ms:6e4,dec:2,tag:"min",name:"minuty",label:"Minuty",st:4},h:{ms:36e5,dec:3,tag:"h",name:"godziny",label:"Godziny",st:5}};

const stamp=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())};
const fileName=ext=>"PKSYSTEM_"+slug(deviceName())+"_"+stamp()+"."+ext;

function entryRecord(e){
  const day=new Date(e.start);day.setHours(0,0,0,0);

  const S=v=>({k:"s",v:String(v==null?"":v)});
  return [S(e.id),S(e.device||deviceName()),{k:"d",v:serial(day.getTime()),s:fmtDate(e.start)},S("Zmiana "+shiftById(e.shift).id),S(e.worker),S(e.client),S(e.project),S(opById(e.op).name),S(e.opText||""),
    {k:"dt",v:serial(e.start),s:fmtDT(e.start)},{k:"dt",v:serial(e.end),s:fmtDT(e.end)},
    {k:"n",v:tconv(entryWork(e)),st:unit().st},{k:"n",v:tconv(entryPause(e)),st:unit().st},S(pz),
    e.qty==null?{k:"e"}:{k:"n",v:e.qty,int:true},S(e.note||""),S(e.review?"TAK":"NIE"),S(e.reviewReason||""),S(e.edited?"TAK":"NIE")];

function csvCell(c){
  if(c.k==="e")return "";

  else if(c.k==="s"){s=c.v;if(/^[=+\-@]/.test(s))s="'"+s}

}
function buildCsv(){
  const head=headers().map(h=>csvCell({k:"s",v:h}));

/* --- plik .xlsx budowany ręcznie (JSZip), bez zewnętrznych bibliotek Excela --- */

    +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCEEF0"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'
    +'<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="167" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>'

  zip.file("xl/_rels/workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');

async function readXlsx(buf){
  const zip=await JSZip.loadAsync(buf);
  const name=Object.keys(zip.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!name)throw new Error("brak arkusza");
  const dp=new DOMParser();let ss=[];
  const ssf=zip.file("xl/sharedStrings.xml");
  if(ssf){
    const sd=dp.parseFromString(await ssf.async("string"),"application/xml");
    ss=Array.from(sd.getElementsByTagName("si")).map(si=>Array.from(si.getElementsByTagName("t")).map(t=>t.textContent).join(""));
  }
  const d=dp.parseFromString(await zip.file(name).async("string"),"application/xml"),rows=[];
  Array.from(d.getElementsByTagName("row")).forEach(row=>{
    const arr=[];
    Array.from(row.getElementsByTagName("c")).forEach(c=>{
      const m=/^([A-Z]+)/.exec(c.getAttribute("r")||"");let ci=arr.length;
      if(m){ci=0;for(const ch of m[1])ci=ci*26+(ch.charCodeAt(0)-64);ci--}
      const t=c.getAttribute("t");let v="";
      if(t==="inlineStr")v=Array.from(c.getElementsByTagName("t")).map(x=>x.textContent).join("");
      else{
        const ve=c.getElementsByTagName("v")[0],raw=ve?ve.textContent:"";
        v=t==="s"?(ss[+raw]||""):(t==="str"||t==="b"||t==="e")?raw:(raw===""?"":Number(raw));
      }
      arr[ci]=v;
    });
    for(let i=0;i<arr.length;i++)if(arr[i]===undefined)arr[i]="";
    rows.push(arr);
  });
  return rows;
}

function saveBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function shareFile(file,title,text){

    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title,text});return "shared"}

/* --- import / scalanie --- */
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const first=text.split(/\r?\n/,1)[0]||"";
  const delim=first.split(";").length>=first.split(",").length?";":",";
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=""}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
    else if(c!=="\r")cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
const num=v=>typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(",","."));
const dtv=v=>typeof v==="number"?fromSerial(v):fromInput(v);
function rowToEntry(h,r){
  const col=n=>{const i=h.indexOf(n);return i<0?"":r[i]};
  const unq=s=>{s=String(s==null?"":s);return /^'[=+\-@]/.test(s)?s.slice(1):s};
  const st=dtv(col("Start")),en=dtv(col("Stop")),worker=clean(unq(col("Pracownik")));
  const opName=String(col("Operacja")).trim().toLowerCase();
  const op=OPS.find(o=>o.name.toLowerCase()===opName);
  if(isNaN(st)||isNaN(en)||en<=st||!worker||!op)return null;
  const pauses=[];
  const pi=h.findIndex(x=>x.indexOf("Pauzy (powód")===0);
  String(pi<0?"":(r[pi]||"")).split("; ").forEach(part=>{
    const m=/^(.*) \(([\d.,]+) (s|min|h)\)$/.exec(part.trim());if(!m)return;
    const lab=m[1].split(" – "),ms=Math.round(num(m[2])*({s:1e3,min:6e4,h:36e5})[m[3]]);
    if(!isNaN(ms))pauses.push({reason:lab[0],text:lab.slice(1).join(" – "),ms});
  });
  const q=col("Sztuki"),sh=/(\d)/.exec(String(col("Zmiana")));
  return {id:String(col("ID wpisu")||("imp-"+st+"-"+worker)),device:clean(unq(col("Urządzenie"))),worker,shift:sh?+sh[1]:1,client:clean(unq(col("Klient"))),project:clean(unq(col("Projekt"))),op:op.id,opText:clean(unq(col("Opis operacji"))),
    start:st,end:en,pauses,qty:(q===""||isNaN(num(q)))?null:Math.round(num(q)),note:clean(unq(col("Uwagi"))),
    review:String(col("Do weryfikacji")).toUpperCase()==="TAK",reviewReason:clean(col("Powód weryfikacji")),edited:String(col("Edytowane przez kierownika")).toUpperCase()==="TAK",savedAt:0};
}
const readFile=(file,bin)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);if(bin)fr.readAsArrayBuffer(file);else fr.readAsText(file,"utf-8")});
async function importFiles(files){
  const have=new Set(entries.map(e=>e.id));let add=0,dup=0,bad=0,fail=0;
  for(const file of files){
    try{
      const isX=/\.xlsx$/i.test(file.name),raw=await readFile(file,isX);
      const rows=isX?await readXlsx(raw):parseCsv(String(raw));
      const h=(rows[0]||[]).map(x=>String(x).trim());
      if(h.indexOf("Start")<0||h.indexOf("Pracownik")<0){fail++;continue}
      rows.slice(1).forEach(r=>{
        const e=rowToEntry(h,r);
        if(!e){bad++;return}
        if(have.has(e.id)){dup++;return}
        have.add(e.id);entries.push(e);add++;
      });
    }catch(err){fail++}
  }
  saveEntries();renderMgr();
  toast("Dodano "+add+", duplikaty: "+dup+(bad?", błędne wiersze: "+bad:"")+(fail?", nieczytelne pliki: "+fail:""));
}
function mgrData(){
  const unsynced=entries.filter(e=>(e.savedAt||0)>lastExport).length;
  return '<div class="setgrid">'
   +'<div class="panel"><h3>Wyślij dane</h3><p class="sub2">Plik Excel ze wszystkimi wpisami z tego urządzenia ('+entries.length+'). Otworzy się okno udostępniania telefonu – wybierz WhatsApp, e-mail albo inną aplikację.</p>'
   +'<button class="btn go wide2" id="sendBtn" data-send="1" disabled>Wyślij dane</button>'
   +'<div class="fileline"><button class="btn ghost small" id="dlX" data-export="xlsx" disabled>Zapisz Excel w telefonie</button><button class="btn ghost small" data-export="csv">Zapisz CSV</button></div>'
   +'<p class="muted">'+(lastExport?'Ostatnie wysłanie lub zapis: '+fmtDate(lastExport)+' '+fmtHM(lastExport)+'. Od tego czasu: '+unsynced+' '+plWpis(unsynced)+'.':'Z tego urządzenia nie wysłano jeszcze danych.')+' Wysyłaj dane po każdej zmianie – wyczyszczenie danych przeglądarki albo usunięcie ikony kasuje wpisy.</p></div>'
   +'<div class="panel"><h3>Jednostka czasu w eksporcie</h3><p class="sub2">Dotyczy kolumn: czas pracy, czas pauz i pauzy (powód). Pozostałe kolumny bez zmian.</p><div class="filters">'+Object.keys(UNITS).map(k=>'<button class="chip" data-unit="'+k+'" aria-pressed="'+(unit()===UNITS[k])+'">'+UNITS[k].label+'</button>').join("")+'</div></div>'
   +'<div class="panel"><h3>Import i scalanie</h3><p class="sub2">Wczytaj pliki otrzymane z innych urządzeń (Excel lub CSV, można kilka naraz). Wpisy, które już tu są, zostaną pominięte (rozpoznanie po ID wpisu).</p>'
   +'<div class="fileline"><input type="file" id="impFile" accept=".csv,.xlsx" multiple hidden><button class="btn ghost" data-pick="impFile">Wybierz pliki</button></div></div>'
   +'<div class="panel"><h3>Kopia ustawień</h3><p class="sub2">Listy pracowników i projektów oraz typ urządzenia. Pozwala skonfigurować inne urządzenie jednym plikiem.</p>'
   +'<div class="fileline"><button class="btn ghost small" data-cfgexp="1">Wyślij ustawienia</button><input type="file" id="cfgFile" accept=".json" hidden><button class="btn ghost small" data-pick="cfgFile">Wczytaj ustawienia</button></div></div>'
   +'</div>';
}

/* ---- Ustawienia ---- */
function mgrSettings(){
  return '<div class="setgrid">'
   +'<div class="panel"><h3>Typ urządzenia</h3><p class="sub2">Wspólne: na ekranie wybiera się pracownika z listy, może działać kilka czasów naraz. Prywatne: telefon zapamiętuje jedną osobę.</p>'
   +'<div class="filters"><button class="chip" data-device="shared" aria-pressed="'+(cfg.device==="shared")+'">Wspólne (produkcja)</button><button class="chip" data-device="private" aria-pressed="'+(cfg.device==="private")+'">Prywatne</button></div>'
   +(cfg.device==="private"?'<p class="muted">Zapamiętana osoba: <b>'+(esc(me)||"brak – wybierze się przy pierwszym starcie")+'</b> '+(me?'<button class="link" data-act="forgetme">wyczyść</button>':'')+'</p>':'')+'</div>'
   +'<div class="panel"><h3>Nazwa urządzenia</h3><p class="sub2">Trafia do nazwy pliku i do kolumny „Urządzenie” w eksporcie, np. „Telefon Rafał” albo „Produkcja – wspólne”.</p><input class="in" id="setDev" maxlength="30" value="'+esc(cfg.deviceName)+'" placeholder="'+esc(deviceName())+'"><button class="btn brand small" style="margin-top:10px" data-save="device">Zapisz nazwę</button></div>'
   +'<div class="panel"><h3>Pracownicy</h3><p class="sub2">Jedna osoba w wierszu. Lista pojawia się na ekranie wyboru.</p><textarea class="in" id="setW" rows="8">'+esc(cfg.workers.join("\n"))+'</textarea><button class="btn brand small" style="margin-top:10px" data-save="workers">Zapisz pracowników</button></div>'
   +'<div class="panel"><h3>Lista projektów (opcjonalna)</h3><p class="sub2">Wiersz w formacie: Klient; Numer projektu. Służy do podpowiedzi przy wpisywaniu. Docelowo lista z Excela na dysku sieciowym.</p><textarea class="in" id="setP" rows="8" placeholder="ABC Systemy; 2026-ABC-003">'+esc(cfg.projects)+'</textarea><button class="btn brand small" style="margin-top:10px" data-save="projects">Zapisz projekty</button></div>'
   +'<div class="panel"><h3>Zmiany i operacje</h3><p class="sub2">Ustawione w pliku aplikacji (stałe na górze kodu).</p><p>'+SHIFTS.map(s=>'<b>'+esc(s.name)+'</b> '+s.from+'–'+s.to).join("<br>")+'</p><p class="muted">Operacje: '+OPS.map(o=>esc(o.name)).join(", ")+'.<br>Powody pauz: '+REASONS.map(r=>esc(r.name)).join(", ")+'.</p></div>'
   +'<div class="panel"><h3>Kod QR do wydruku</h3><p class="sub2">Prowadzi pod adres, z którego otwarto tę aplikację. Otwórz ją z docelowego adresu, żeby kod był właściwy.</p><div id="qr"></div><div class="url">'+esc(location.href.split("#")[0].split("?")[0])+'</div></div>'
   +'<div class="panel"><h3>Aktualizacja aplikacji</h3><p class="sub2">Wersja: <b>'+VERSION+'</b>. Jeśli telefon pokazuje starą wersję, wymuś aktualizację. Zapisane wpisy zostają.</p><div class="fileline"><button class="btn ghost small" data-upd="check">Sprawdź aktualizację</button><button class="btn brand small" data-upd="force">Wymuś aktualizację</button></div></div>'
   +'<div class="panel"><h3>Dane na tym urządzeniu</h3><p class="sub2">Zapisane wpisy: '+entries.length+'.</p><button class="btn ghost small" style="color:var(--stop)" data-wipe="1">Usuń wszystkie dane</button></div>'
   +'</div>';
}
function drawQR(){
  const q=$("#qr");if(!q||!window.PKQR)return;
  const url=location.href.split("#")[0].split("?")[0];
  let m;try{m=window.PKQR(url)}catch(e){q.textContent="Nie udało się wygenerować kodu QR.";return}
  let p="";for(let r=0;r<m.n;r++)for(let c=0;c<m.n;c++)if(m.isDark(r,c))p+="M"+c+" "+r+"h1v1h-1z";
  const s=m.n+8;
  q.innerHTML='<svg viewBox="-4 -4 '+s+' '+s+'" width="200" height="200" role="img" aria-label="Kod QR z adresem aplikacji" shape-rendering="crispEdges"><rect x="-4" y="-4" width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+p+'" fill="#13313A"/></svg>';
}

mgrEl.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(b.id==="pinOk"){checkPin();return}
  if(b.id==="lockBtn"){unlocked=false;renderMgr();return}
  if(d.seg){mgrTab=d.seg;renderMgr();return}
  if(d.range!==undefined){range=+d.range;renderMgr();return}
  if(d.review){onlyReview=!onlyReview;renderMgr();return}
  if(d.edit){openEditor(d.edit);return}
  if(d.del){confirmDelete(d.del);return}
  if(d.upd==='check'){checkUpdate();return}
  if(d.upd==='force'){forceUpdate();return}
  if(d.unit){cfg.timeUnit=d.unit;saveCfg();renderMgr();toast("Jednostka czasu w eksporcie: "+UNITS[d.unit].name);return}
  if(d.send){doSend();return}
  if(d.export){doExport(d.export);return}
  if(d.pick){$("#"+d.pick).click();return}
  if(d.cfgexp){
    const f=new File([JSON.stringify({workers:cfg.workers,projects:cfg.projects,device:cfg.device,deviceName:cfg.deviceName,timeUnit:cfg.timeUnit},null,1)],"PKSYSTEM_ustawienia.json",{type:"application/json"});
    shareFile(f,"PKSYSTEM – ustawienia","Ustawienia aplikacji PKSYSTEM").then(r=>{if(r==="downloaded")toast("Plik ustawień zapisany w telefonie")});return;
  }
  if(d.device){cfg.device=d.device;saveCfg();resetFlow();renderMgr();toast(d.device==="shared"?"Urządzenie wspólne":"Urządzenie prywatne");return}
  if(d.act==="forgetme"){me="";store.set("pk_me","");renderMgr();return}
  if(d.save==="workers"){
    const l=Array.from(new Set($("#setW").value.split(/\r?\n/).map(clean).filter(Boolean))).slice(0,60);
    if(!l.length){toast("Lista pracowników nie może być pusta");return}
    cfg.workers=l;saveCfg();toast("Zapisano pracowników ("+l.length+")");return;
  }
  if(d.save==="projects"){cfg.projects=$("#setP").value;saveCfg();toast("Zapisano listę projektów");return}
  if(d.save==="device"){cfg.deviceName=clean($("#setDev").value).slice(0,30);saveCfg();toast("Zapisano nazwę urządzenia");renderMgr();return}
  if(d.wipe){
    openDlg('<div class="dlg-body"><h2>Usunąć wszystkie dane?</h2><p>Skasuje wszystkie wpisy i uruchomione czasy z tego urządzenia. Najpierw wyślij dane.</p><div class="row2"><button class="btn ghost" data-close>Anuluj</button><button class="btn stop" id="wipeOk">Usuń wszystko</button></div></div>',
      ev=>{if(ev.target.closest("#wipeOk")){entries=[];active=[];saveEntries();saveActive();dlg.close();updateBadge();renderMgr();toast("Dane usunięte")}});
  }
});
mgrEl.addEventListener("change",e=>{
  if(e.target.id==="impFile"&&e.target.files.length){importFiles(Array.from(e.target.files));e.target.value=""}
  else if(e.target.id==="cfgFile"&&e.target.files[0]){
    const f=e.target.files[0];e.target.value="";
    readFile(f,false).then(txt=>{
      const j=JSON.parse(txt);
      if(Array.isArray(j.workers)&&j.workers.length)cfg.workers=j.workers.map(clean).filter(Boolean).slice(0,60);
      if(typeof j.projects==="string")cfg.projects=j.projects;
      if(["s","min","h"].indexOf(j.timeUnit)>=0)cfg.timeUnit=j.timeUnit;
      if(typeof j.deviceName==="string")cfg.deviceName=clean(j.deviceName).slice(0,30);
      if(j.device==="shared"||j.device==="private")cfg.device=j.device;
      saveCfg();renderMgr();toast("Wczytano ustawienia");
    }).catch(()=>toast("Plik ustawień jest uszkodzony"));
  }
});
mgrEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin")checkPin()});
function checkPin(){
  const v=$("#pin").value;
  if(v===PIN){unlocked=true;renderMgr()}
  else{$("#pinErr").textContent="Nieprawidłowy PIN.";$("#pin").value="";$("#pin").focus()}
}

/* ---------- orientacja pionowa ---------- */
const rot=$("#rotate");
function checkRot(){
  let land=false;
  try{land=(screen.orientation&&screen.orientation.type)?screen.orientation.type.indexOf("landscape")===0:innerWidth>innerHeight}catch(e){land=innerWidth>innerHeight}
  const small=Math.min(screen.width,screen.height)<700;
  let coarse=false;try{coarse=matchMedia("(pointer: coarse)").matches}catch(e){}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  rot.hidden=!(land&&small&&coarse&&!typing);
}
["resize","orientationchange"].forEach(ev=>window.addEventListener(ev,checkRot));
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",checkRot);
document.addEventListener("focusin",checkRot);
document.addEventListener("focusout",()=>setTimeout(checkRot,150));

/* ---------- start ---------- */
applyTheme(store.get("pk_theme",null));
setTab("home");
checkRot();
/* ---------- aktualizacje aplikacji ---------- */
function showUpdate(){
  if($("#upd"))return;
  const d=document.createElement("div");d.id="upd";d.className="upd";
  d.innerHTML='<span>Dostępna nowa wersja aplikacji</span><button class="btn go small" id="updBtn">Odśwież</button>';
  document.body.appendChild(d);$("#updBtn").onclick=()=>location.reload();
}
async function checkUpdate(){
  if(!("serviceWorker" in navigator)){toast("Ta przeglądarka nie obsługuje aktualizacji w tle");return}
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){toast("Aplikacja działa bez trybu offline");return}
    await reg.update();toast("Sprawdzono. Jeśli jest nowa wersja, pojawi się komunikat.");
  }catch(e){toast("Nie udało się sprawdzić aktualizacji (brak internetu?)")}
}
async function forceUpdate(){
  try{
    if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
  }catch(e){}
  location.reload();
}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadCtl)return;
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
    if(tab==="home"&&flow.step===1&&!dlg.open&&!typing)location.reload();else showUpdate();
  });
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{if(r&&r.update)r.update()}).catch(()=>{})});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
